<!DOCTYPE html>
<html lang="tr">
  <head>
    <!--
      charset = karakter kodlamasını tanımlar.
      Türkçe karakterler için önemlidir.
    -->
    <meta charset="UTF-8" />

    <!--
      viewport = mobil cihazlarda sayfa düzgün görünür.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!--
      description = sayfa açıklaması.
      Arama motorlarına sayfa hakkında kısa bilgi verir.
    -->
    <meta
      name="description"
      content="Hava durumu bilgilerini gösteren öğrenme amaçlı bir web sayfası."
    />

    <!--
      title = tarayıcı sekmesindeki başlık.
    -->
    <title>Hava Durumu Öğrenme</title>
    <link rel="stylesheet" href="style.css" /> <!-- sanırım burası style.css e bağlayacağım kısım-->

  </head>

  <body>
    <div class ="city-card">
        <h2>Antalya</h2>
        <p>Hava durumu: Yağmurlu</p>
        </div>
     <div class ="city-card">
        <h2>İstanbul</h2>
        <p>Hava durumu: Güneşli</p>
        </div>   
        
  </body>
</html>
