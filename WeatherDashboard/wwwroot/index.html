<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="page">

        <h1 class="header-title">Weather Dashboard</h1>

        <div class="top-bar">
            <!-- Sol: Countries -->
            <div class="country-area">
                <button type="button" id="mainCountryBtn" class="main-country-btn">
                    Countries <span>▾</span>
                </button>
                <div class="country-dropdown">

                    <div class="country-item">
                        <button type="button" class="sub-country-btn">🇹🇷 Turkey</button>
                        <div class="city-menu">
                            <button class="city-btn">Istanbul</button>
                            <button class="city-btn">Ankara</button>
                            <button class="city-btn">Izmir</button>
                            <button class="city-btn">Antalya</button>
                            <button class="city-btn">Bursa</button>
                            <button class="city-btn">Adana</button>
                            <button class="city-btn">Trabzon</button>
                        </div>
                    </div>

                    <div class="country-item">
                        <button type="button" class="sub-country-btn">🇺🇸 USA</button>
                        <div class="city-menu">
                            <button class="city-btn">New York</button>
                            <button class="city-btn">Los Angeles</button>
                            <button class="city-btn">Chicago</button>
                            <button class="city-btn">Houston</button>
                            <button class="city-btn">Miami</button>
                            <button class="city-btn">Seattle</button>
                            <button class="city-btn">Boston</button>
                        </div>
                    </div>

                    <div class="country-item">
                        <button type="button" class="sub-country-btn">🇩🇪 Germany</button>
                        <div class="city-menu">
                            <button class="city-btn">Berlin</button>
                            <button class="city-btn">Munich</button>
                            <button class="city-btn">Hamburg</button>
                            <button class="city-btn">Frankfurt</button>
                            <button class="city-btn">Cologne</button>
                            <button class="city-btn">Stuttgart</button>
                            <button class="city-btn">Düsseldorf</button>
                        </div>
                    </div>

                    <div class="country-item">
                        <button type="button" class="sub-country-btn">🇫🇷 France</button>
                        <div class="city-menu">
                            <button class="city-btn">Paris</button>
                            <button class="city-btn">Lyon</button>
                            <button class="city-btn">Marseille</button>
                            <button class="city-btn">Nice</button>
                            <button class="city-btn">Toulouse</button>
                            <button class="city-btn">Bordeaux</button>
                            <button class="city-btn">Strasbourg</button>
                        </div>
                    </div>

                    <div class="country-item">
                        <button type="button" class="sub-country-btn">🇬🇧 UK</button>
                        <div class="city-menu">
                            <button class="city-btn">London</button>
                            <button class="city-btn">Manchester</button>
                            <button class="city-btn">Birmingham</button>
                            <button class="city-btn">Leeds</button>
                            <button class="city-btn">Glasgow</button>
                            <button class="city-btn">Edinburgh</button>
                            <button class="city-btn">Bristol</button>
                        </div>
                    </div>

                    <div class="country-item">
                        <button type="button" class="sub-country-btn">🇯🇵 Japan</button>
                        <div class="city-menu">
                            <button class="city-btn">Tokyo</button>
                            <button class="city-btn">Osaka</button>
                            <button class="city-btn">Kyoto</button>
                            <button class="city-btn">Hiroshima</button>
                            <button class="city-btn">Sapporo</button>
                            <button class="city-btn">Nagoya</button>
                            <button class="city-btn">Fukuoka</button>
                        </div>
                    </div>

                    <div class="country-item">
                        <button type="button" class="sub-country-btn">🇮🇹 Italy</button>
                        <div class="city-menu">
                            <button class="city-btn">Rome</button>
                            <button class="city-btn">Milan</button>
                            <button class="city-btn">Venice</button>
                            <button class="city-btn">Florence</button>
                            <button class="city-btn">Naples</button>
                            <button class="city-btn">Turin</button>
                            <button class="city-btn">Bologna</button>
                        </div>
                    </div>

                    <div class="country-item">
                        <button type="button" class="sub-country-btn">🇪🇸 Spain</button>
                        <div class="city-menu">
                            <button class="city-btn">Madrid</button>
                            <button class="city-btn">Barcelona</button>
                            <button class="city-btn">Seville</button>
                            <button class="city-btn">Valencia</button>
                            <button class="city-btn">Bilbao</button>
                            <button class="city-btn">Malaga</button>
                            <button class="city-btn">Zaragoza</button>
                        </div>
                    </div>

                    <div class="country-item">
                        <button type="button" class="sub-country-btn">🇧🇷 Brazil</button>
                        <div class="city-menu">
                            <button class="city-btn">São Paulo</button>
                            <button class="city-btn">Rio de Janeiro</button>
                            <button class="city-btn">Brasília</button>
                            <button class="city-btn">Salvador</button>
                            <button class="city-btn">Fortaleza</button>
                            <button class="city-btn">Curitiba</button>
                            <button class="city-btn">Manaus</button>
                        </div>
                    </div>

                    <div class="country-item">
                        <button type="button" class="sub-country-btn">🇦🇺 Australia</button>
                        <div class="city-menu">
                            <button class="city-btn">Sydney</button>
                            <button class="city-btn">Melbourne</button>
                            <button class="city-btn">Brisbane</button>
                            <button class="city-btn">Perth</button>
                            <button class="city-btn">Adelaide</button>
                            <button class="city-btn">Canberra</button>
                            <button class="city-btn">Darwin</button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Sağ: Arama -->
            <div class="search-panel">
                <input type="text" id="searchInput" class="search-input" placeholder="Search city..." autocomplete="off" />
                <ul id="searchResults" class="search-results"></ul>
            </div>
        </div>

        <!-- Ana weather card -->
        <div class="weather-card">
            <div class="weather-emoji" id="weatherEmoji">🌡️</div>
            <h2 id="cityName" class="weather-city">City Name</h2>
            <div class="weather-temp" id="weatherTemp">--°C</div>
            <div class="weather-desc" id="weatherDesc">--</div>
            <button id="favoriteToggle" type="button" class="favorite-toggle">☆ Add to Favorites</button>
        </div>

        <!-- Favorites -->
        <div class="favorite-box">
            <h3>Favorite Cities</h3>
            <div class="favorite-list"></div>
        </div>

    </div>
    <script src="js/script.js"></script>
</body>
</html>
