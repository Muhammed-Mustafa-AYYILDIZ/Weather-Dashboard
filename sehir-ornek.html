<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Şehir Örneği</title>
  </head>
  <body>
    <div>
      <!-- Bu div bir şehir kartı gibi düşünülebilir -->
      <h1>İstanbul</h1>
      <!-- h1 büyük başlık, şehir adı burada -->

      <p>Hava durumu: Güneşli</p>
      <!-- p paragraf, kısa açıklama yazısı -->

      <p>Sıcaklık: 28°C</p>
      <!-- Bu satır sıcaklığı gösterir -->
    </div>

    <div>
      <!-- İkinci bir şehir için başka bir kart -->
      <h1>Ankara</h1>
      <p>Hava durumu: Bulutlu</p>
      <p>Sıcaklık: 22°C</p>
    </div>
    <div>
        <h1>Antalya</h1>
        <p>Hava durumu: Yağmurlu</p>
        <p>Sıcaklık: 25°C</p>
    </div>
  </body>
</html>
